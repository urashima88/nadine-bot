  migration-runner:
    build:
      context: . 
      dockerfile: ./docker/bot/Dockerfile
      target: migration
    restart: "no"
    profiles:
      - migrations
    volumes:
      - ./migrations:/migrations:ro
      - .:/app:ro
      - ./logs:/app/logs
    networks:
      - jewelry_network
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    command: python -m src.database.migrate upgrade head
    env_file:
      - .env
    container_name: jewelry_migrations
    
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local